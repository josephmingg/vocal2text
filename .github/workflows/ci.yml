name: CI

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "docs/**"
      - "*.md"
  pull_request:
    paths-ignore:
      - "docs/**"
      - "*.md"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Fast + cheap: pure-logic targets on Linux. Apple-only targets compile to
  # guarded stubs here, so this job proves the whole package parses and the
  # text pipeline / cleanup / profile / session logic passes its tests.
  linux-core:
    name: Linux — core tests
    runs-on: ubuntu-latest
    container: swift:6.0-noble
    steps:
      - uses: actions/checkout@v4
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-linux-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-linux-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  # The real thing: full dependency graph (GRDB, WhisperKit) + all tests on macOS.
  macos-full:
    name: macOS — full build & tests
    runs-on: macos-15
    needs: linux-core
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: |
          ls /Applications | grep -i xcode || true
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
          swift --version
      - name: Cache SPM
        uses: actions/cache@v4
        with:
          path: .build
          key: spm-macos-${{ hashFiles('Package.swift', 'Package.resolved') }}
          restore-keys: spm-macos-
      - name: Build
        run: swift build --build-tests
      - name: Test
        run: swift test

  # The keyboard runs inside other people's apps. Its "no network calls"
  # promise is only worth making if it is checkable, so check it: the target
  # must not reference any networking API, and its only package dependencies
  # (project.yml) are CoreModels + BridgeKit.
  keyboard-offline-guard:
    name: Keyboard — offline guard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No networking symbols in the keyboard or the bridge
        run: |
          pattern='URLSession|URLRequest|import Network|import FoundationNetworking|CFNetwork|NWConnection|NSURLConnection|Socket'
          if grep -rnE "$pattern" apps/iOSKeyboard Sources/BridgeKit; then
            echo "::error::networking reference found in an offline-only target"
            exit 1
          fi
          echo "clean: no networking references"

  # The VocalIOS app target plus its three embedded extensions: unsigned
  # simulator compile. Building the app scheme builds the keyboard, share, and
  # widget extensions too, because they are embedded dependencies.
  ios-app:
    name: iOS — VocalIOS app + extensions build
    runs-on: macos-15
    needs: macos-full
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Build app (unsigned, simulator)
        run: |
          set +e
          xcodebuild -project Vocal.xcodeproj -scheme VocalIOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-ios \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build > build-ios.log 2>&1
          status=$?
          set -e
          grep -E "error:" build-ios.log | head -80 || true
          tail -5 build-ios.log
          exit $status
      - name: Show the embedded extensions
        run: |
          app=$(find build-ios/Build/Products -name 'VocalIOS.app' -maxdepth 3 | head -1)
          echo "app bundle: $app"
          ls -1 "$app/PlugIns"

      # The owner is not enrolled in the paid Developer Program, so the
      # free-Apple-ID variant is a shipping configuration, not a curiosity:
      # prove the derived spec still generates and builds, and that it carries
      # no App Group entitlement (which a personal team cannot sign).
      - name: Build the free-Apple-ID variant
        run: |
          python3 scripts/free-account-spec.py project.yml project-free.yml
          if grep -q "application-groups" project-free.yml; then
            echo "::error::the free spec still declares an App Group"
            exit 1
          fi
          xcodegen generate --spec project-free.yml
          set +e
          xcodebuild -project VocalFree.xcodeproj -scheme VocalIOS -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build-free \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build > build-free.log 2>&1
          status=$?
          set -e
          grep -E "error:" build-free.log | head -40 || true
          tail -3 build-free.log
          exit $status

      - name: Show what the free variant embeds
        run: |
          app=$(find build-free/Build/Products -name 'VocalIOS.app' -maxdepth 3 | head -1)
          echo "app bundle: $app"
          # Expect the widget only — no keyboard, no share extension.
          ls -1 "$app/PlugIns"

  # The VocalMac app target: XcodeGen project + unsigned xcodebuild compile.
  macos-app:
    name: macOS — VocalMac app build
    runs-on: macos-15
    needs: macos-full
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)/Contents/Developer"
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Cache DerivedData SPM
        uses: actions/cache@v4
        with:
          path: ~/Library/Developer/Xcode/DerivedData/**/SourcePackages
          key: xcode-spm-${{ hashFiles('Package.swift') }}
          restore-keys: xcode-spm-
      - name: Build app (unsigned)
        run: |
          set +e
          xcodebuild -project Vocal.xcodeproj -scheme VocalMac -configuration Debug \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build > build.log 2>&1
          status=$?
          set -e
          grep -E "error:" build.log | head -80 || true
          tail -5 build.log
          exit $status

